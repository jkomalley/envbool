name: Snap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # CD calls this workflow to build and test the snaps it publishes, so a
  # release ships exactly what passed these checks.
  workflow_call:

# Read-only: this workflow also runs inside CD (workflow_call), and nothing
# here needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: canonical/craft-actions/snapcraft/pack@v0.1.1
        id: snapcraft

      - name: Test installed snap
        run: |
          sudo snap install --dangerous ${{ steps.snapcraft.outputs.snap }}
          test "$(/snap/bin/envbool --print --value yes)" = true
          test "$(/snap/bin/envbool --print --value no)" = false
          test "$(DEBUG=on /snap/bin/envbool --print DEBUG)" = true

      # Guard the snapcraft.yaml prime filter: the venv's build tooling is
      # dead weight at runtime and must not creep back into the snap.
      - name: Check snap excludes build tooling
        run: |
          ls -lh ${{ steps.snapcraft.outputs.snap }}
          if unsquashfs -l ${{ steps.snapcraft.outputs.snap }} \
              | grep -E "site-packages/(pip|setuptools|wheel|packaging)(/|-)|bin/(pip|wheel|activate)"; then
            echo "::error::build tooling found in snap"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: envbool-${{ runner.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
