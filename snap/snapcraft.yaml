name: envbool
base: core24
summary: Tool for coercing environment variables into boolean values
description: |
  A tool for coercing environment variables (and arbitrary strings) into boolean values.

  Exits `0` for truthy, `1` for falsy, and `2` on error.

  **Usage**

     $ export DEBUG=true
     $ envbool DEBUG && echo "debug is on"
     debug is on

     $ echo "Verbose: $(envbool --print VERBOSE)"
     Verbose: false

     $ echo "yes" | envbool && echo "truthy"
     truthy

     $ envbool --strict ENABLE_CACHE || echo "cache is off or misconfigured"
     cache is off or misconfigured
grade: stable
confinement: strict
license: MIT
adopt-info: envbool
parts:
  envbool:
    plugin: python
    source: .
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
    # The python plugin builds a venv and upgrades pip/setuptools/wheel into
    # it; none of that is used at runtime (envbool has no dependencies), and
    # it is nearly all of the snap's size. `python3.*` keeps the filter valid
    # when the base (and its Python) changes.
    prime:
      - -lib/python3.*/site-packages/pip
      - -lib/python3.*/site-packages/pip-*
      - -lib/python3.*/site-packages/setuptools
      - -lib/python3.*/site-packages/setuptools-*
      - -lib/python3.*/site-packages/pkg_resources
      - -lib/python3.*/site-packages/_distutils_hack
      - -lib/python3.*/site-packages/distutils-precedence.pth
      - -lib/python3.*/site-packages/wheel
      - -lib/python3.*/site-packages/wheel-*
      - -lib/python3.*/site-packages/packaging
      - -lib/python3.*/site-packages/packaging-*
      - -bin/pip*
      - -bin/wheel
      - -bin/activate*
      - -bin/Activate.ps1
apps:
  envbool:
    command: bin/envbool
